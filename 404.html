    <style>
        .nf { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 14px; }
        .nf-bars { display: grid; grid-template-columns: repeat(7, 1fr); width: min(520px, 90vw); height: 90px; }

        .nf-bars span:nth-child(3) { background: #00c0c0; } .nf-bars span:nth-child(4) { background: #00c000; }
        .nf-bars span:nth-child(5) { background: #c000c0; } .nf-bars span:nth-child(6) { background: #c00000; }
        .nf-bars span:nth-child(7) { background: #0000c0; }
        .nf-code { font-family: var(--osd); font-size: 20px; letter-spacing: 4px; color: var(--ink-dim); }
        .nf h1 { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 14vw, 120px); line-height: .9; text-transform: uppercase; }
        .nf p { font-family: var(--osd); font-size: 20px; letter-spacing: 1px; color: var(--ink-dim); max-width: 36ch; }
        .nf .vhs-btn { margin-top: 8px; }
    </style>
</head>

    </main>
