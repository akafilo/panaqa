<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso Omiso | PANAQA</title>
    <meta name="description" content="Escucha Caso Omiso de PANAQA en Spotify, Apple Music y YouTube.">
    <meta name="theme-color" content="#0f0f10">

    <meta property="og:title" content="Caso Omiso | PANAQA">
    <meta property="og:description" content="Linktree oficial de Caso Omiso.">
    <meta property="og:image" content="assets/omiso.jpeg">
    <meta property="og:type" content="music.song">

    <link rel="icon" type="image/png" href="assets/logonegro.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-1: #060606;
            --bg-2: #1d1d22;
            --card: rgba(255, 255, 255, 0.08);
            --text: #f6f6f6;
            --muted: #c9c9c9;
            --line: rgba(255, 255, 255, 0.18);
            --spotify: #1db954;
            --apple: #fc3c44;
            --yt: #ff0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            color: var(--text);
            background: #060606;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            pointer-events: none;
        }

        .background-video-overlay {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(1200px 550px at 50% -10%, rgba(181, 22, 30, 0.28), transparent 60%),
                rgba(8, 8, 10, 0.6);
            z-index: 0;
        }

        .shell {
            width: min(520px, 100%);
            border: 1px solid var(--line);
            border-radius: 26px;
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 24px;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
            animation: pop 0.5s ease;
            position: relative;
            z-index: 1;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top {
            text-align: center;
            margin-bottom: 20px;
        }

        .cover {
            width: 234px;
            height: 234px;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 8vw, 2.8rem);
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .artist {
            color: var(--muted);
            margin-top: 5px;
            letter-spacing: 0.2px;
        }

        .links {
            display: grid;
            gap: 12px;
            margin-top: 12px;
        }

        .official-video {
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(210, 45, 55, 0.75);
            border-radius: 999px;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1.2px;
            font-size: 1.08rem;
            background: #6f1d22;
            box-shadow: 0 8px 18px rgba(184, 35, 45, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .official-video:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(111, 29, 34, 0.45);
            filter: brightness(1.03);
        }

        .stream-btn {
            text-decoration: none;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            justify-content: space-between;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
            font-size: 1.15rem;
            background: rgba(0, 0, 0, 0.33);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .stream-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(0, 0, 0, 0.32);
        }

        .stream-btn i {
            font-size: 1.1rem;
        }

        .stream-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .stream-name {
            white-space: nowrap;
        }

        .listen-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 999px;
            background: #166f7f;
            border: 1px solid #166f7f;
            color: #ffffff;
            font-size: 0.92rem;
            letter-spacing: 1px;
            flex: 0 0 auto;
        }

        .stream-btn.spotify:hover {
            background: rgba(29, 185, 84, 0.18);
            border-color: rgba(29, 185, 84, 0.8);
        }

        .stream-btn.apple:hover {
            background: rgba(252, 60, 68, 0.18);
            border-color: rgba(252, 60, 68, 0.8);
        }

        .stream-btn.youtube:hover {
            background: rgba(255, 0, 0, 0.18);
            border-color: rgba(255, 0, 0, 0.8);
        }

        .stream-btn.deezer:hover {
            background: rgba(162, 56, 255, 0.18);
            border-color: rgba(162, 56, 255, 0.8);
        }

        .back {
            display: inline-flex;
            margin-top: 18px;
            width: 100%;
            justify-content: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back:hover {
            color: var(--text);
        }

        .download-note {
            position: relative;
            z-index: 1;
            width: min(520px, 100%);
            text-align: center;
            margin-top: 14px;
            color: #e7e7e7;
            font-size: 0.95rem;
            line-height: 1.45;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
        }

        @media (max-width: 480px) {
            .shell {
                padding: 20px 16px;
                border-radius: 20px;
            }

            .cover {
                width: 207px;
                height: 207px;
            }

            .stream-btn {
                font-size: 1rem;
                padding: 12px 14px;
            }

            .listen-pill {
                padding: 7px 12px;
                font-size: 0.84rem;
            }

            .official-video {
                font-size: 0.96rem;
                padding: 12px 13px;
            }

            .download-note {
                font-size: 0.88rem;
                margin-top: 12px;
                padding: 0 4px;
            }
        }
    </style>
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline webkit-playsinline x5-playsinline poster="assets/omiso.jpeg">
        <source src="assets/caso.mp4" type="video/mp4">
    </video>
    <div class="background-video-overlay" aria-hidden="true"></div>
    <main class="shell">
        <section class="top">
            <img src="assets/omiso.jpeg" alt="Portada de Caso Omiso" class="cover">
            <p class="artist">PANAQA</p>
        </section>

        <section class="links" aria-label="Plataformas de streaming">
            <a class="official-video" href="https://youtu.be/EArbmlM4Mqk">
                <i class="fas fa-play-circle" aria-hidden="true"></i>
                VER VIDEOCLIP OFICIAL
            </a>
            <a class="stream-btn spotify" href="https://open.spotify.com/intl-es/track/0GOv1ReuykGcUNw3NMTVM2?si=f7881d0b47654327" target="_blank" rel="noopener noreferrer" data-app-url="spotify:track:0GOv1ReuykGcUNw3NMTVM2">
                <span class="stream-left">
                    <i class="fab fa-spotify" aria-hidden="true"></i>
                    <span class="stream-name">SPOTIFY</span>
                </span>
                <span class="listen-pill">ESCUCHAR</span>
            </a>
            <a class="stream-btn apple" href="https://music.apple.com/es/song/caso-omiso/6771792254" target="_blank" rel="noopener noreferrer" data-app-url="music://song/6771792254">
                <span class="stream-left">
                    <i class="fab fa-apple" aria-hidden="true"></i>
                    <span class="stream-name">APPLE MUSIC</span>
                </span>
                <span class="listen-pill">ESCUCHAR</span>
            </a>
            <a class="stream-btn youtube" href="https://www.youtube.com/watch?v=kk-gxwCHHeQ" target="_blank" rel="noopener noreferrer" data-app-url="vnd.youtube://watch?v=kk-gxwCHHeQ">
                <span class="stream-left">
                    <i class="fab fa-youtube" aria-hidden="true"></i>
                    <span class="stream-name">YOUTUBE</span>
                </span>
                <span class="listen-pill">ESCUCHAR</span>
            </a>
            <a class="stream-btn deezer" href="https://link.deezer.com/s/33pcpR6r4cwTTsLtXIS61" target="_blank" rel="noopener noreferrer" data-app-url="deezer://link.deezer.com/s/33pcpR6r4cwTTsLtXIS61">
                <span class="stream-left">
                    <i class="fab fa-deezer" aria-hidden="true"></i>
                    <span class="stream-name">DEEZER</span>
                </span>
                <span class="listen-pill">ESCUCHAR</span>
            </a>
        </section>

        <a class="back" href="index.html">Volver a PANAQA</a>
    </main>

    <p class="download-note">¿Quieres descargar el audio y tenerlo en tu teléfono para siempre? escribenos a contacto@panaqa.net ;)</p>

    <script>
        (function () {
            const buttons = document.querySelectorAll('.stream-btn[data-app-url]');
            const fallbackDelay = 1200;

            buttons.forEach(function (button) {
                button.addEventListener('click', function (event) {
                    event.preventDefault();

                    const appUrl = button.dataset.appUrl;
                    const fallbackUrl = button.href;
                    let appOpened = false;

                    const onVisibilityChange = function () {
                        if (document.visibilityState === 'hidden') {
                            appOpened = true;
                        }
                    };

                    document.addEventListener('visibilitychange', onVisibilityChange, { once: true });
                    window.location.href = appUrl;

                    setTimeout(function () {
                        document.removeEventListener('visibilitychange', onVisibilityChange);

                        if (!appOpened && document.visibilityState === 'visible') {
                            window.location.href = fallbackUrl;
                        }
                    }, fallbackDelay);
                });
            });
        })();
    </script>
</body>
</html>
