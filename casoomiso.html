<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso Omiso | PANAQA</title>
    <meta name="description" content="Escucha Caso Omiso de PANAQA en Spotify, Apple Music y YouTube.">
    <meta name="theme-color" content="#0f0f10">

    <meta property="og:title" content="Caso Omiso | PANAQA">
    <meta property="og:description" content="Linktree oficial de Caso Omiso.">
    <meta property="og:image" content="assets/omiso.jpeg">
    <meta property="og:type" content="music.song">

    <link rel="icon" type="image/png" href="assets/logonegro.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-1: #060606;
            --bg-2: #1d1d22;
            --card: rgba(255, 255, 255, 0.08);
            --text: #f6f6f6;
            --muted: #c9c9c9;
            --line: rgba(255, 255, 255, 0.18);
            --spotify: #1db954;
            --apple: #fc3c44;
            --yt: #ff0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 550px at 50% -10%, rgba(181, 22, 30, 0.24), transparent 60%),
                linear-gradient(165deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .shell {
            width: min(520px, 100%);
            border: 1px solid var(--line);
            border-radius: 26px;
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 24px;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top {
            text-align: center;
            margin-bottom: 20px;
        }

        .cover {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 8vw, 2.8rem);
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .artist {
            color: var(--muted);
            margin-top: 5px;
            letter-spacing: 0.2px;
        }

        .links {
            display: grid;
            gap: 12px;
            margin-top: 12px;
        }

        .stream-btn {
            text-decoration: none;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
            font-size: 1.15rem;
            background: rgba(0, 0, 0, 0.33);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .stream-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(0, 0, 0, 0.32);
        }

        .stream-btn i {
            font-size: 1.1rem;
        }

        .stream-btn.spotify:hover {
            background: rgba(29, 185, 84, 0.18);
            border-color: rgba(29, 185, 84, 0.8);
        }

        .stream-btn.apple:hover {
            background: rgba(252, 60, 68, 0.18);
            border-color: rgba(252, 60, 68, 0.8);
        }

        .stream-btn.youtube:hover {
            background: rgba(255, 0, 0, 0.18);
            border-color: rgba(255, 0, 0, 0.8);
        }

        .stream-btn.deezer:hover {
            background: rgba(162, 56, 255, 0.18);
            border-color: rgba(162, 56, 255, 0.8);
        }

        .back {
            display: inline-flex;
            margin-top: 18px;
            width: 100%;
            justify-content: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back:hover {
            color: var(--text);
        }

        @media (max-width: 480px) {
            .shell {
                padding: 20px 16px;
                border-radius: 20px;
            }

            .cover {
                width: 106px;
                height: 106px;
            }

            .stream-btn {
                font-size: 1rem;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="top">
            <img src="assets/omiso.jpeg" alt="Portada de Caso Omiso" class="cover">
            <h1>CASO OMISO</h1>
            <p class="artist">PANAQA</p>
        </section>

        <section class="links" aria-label="Plataformas de streaming">
            <a class="stream-btn spotify" href="https://open.spotify.com/intl-es/track/0GOv1ReuykGcUNw3NMTVM2?si=f7881d0b47654327" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-spotify" aria-hidden="true"></i>
                SPOTIFY
            </a>
            <a class="stream-btn apple" href="https://music.apple.com/es/song/caso-omiso/6771792254" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-apple" aria-hidden="true"></i>
                APPLE MUSIC
            </a>
            <a class="stream-btn youtube" href="https://www.youtube.com/watch?v=kk-gxwCHHeQ" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-youtube" aria-hidden="true"></i>
                YOUTUBE
            </a>
            <a class="stream-btn deezer" href="https://link.deezer.com/s/33pcpR6r4cwTTsLtXIS61" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-deezer" aria-hidden="true"></i>
                DEEZER
            </a>
        </section>

        <a class="back" href="index.html">Volver a PANAQA</a>
    </main>
</body>
</html>
