# Panel de administración de PANAQA (Decap CMS)
# Se entra en https://www.panaqa.com/admin con una cuenta de GitHub que tenga
# permiso de escritura en el repositorio. Cada cambio publicado es un commit
# en la rama main y Netlify actualiza el sitio en 1–2 minutos.

backend:
  name: github
  repo: akafilo/panaqa
  branch: main
  site_domain: www.panaqa.com
  commit_messages:
    update: "Admin: actualiza {{collection}}"

locale: es
site_url: https://www.panaqa.com
display_url: https://www.panaqa.com
logo_url: /assets/logonegro.png

# Fotos de productos: se guardan en assets/merch y se enlazan como /assets/merch/archivo.jpg
media_folder: assets/merch
public_folder: /assets/merch

collections:
  # ───────────────────────── FECHAS ─────────────────────────
  - name: fechas
    label: Fechas
    description: Presentaciones que aparecen en la sección Fechas y en la cinta roja de la portada. Las fechas que ya pasaron se ocultan solas.
    editor:
      preview: false
    files:
      - name: fechas
        label: Fechas de presentaciones
        file: data/fechas.json
        format: json
        fields:
          - label: Fechas
            name: fechas
            label_singular: fecha
            widget: list
            summary: "{{fields.fecha}} — {{fields.lugar}} ({{fields.ciudad}})"
            fields:
              - label: Fecha
                name: fecha
                widget: datetime
                date_format: DD/MM/YYYY
                time_format: false
                format: YYYY-MM-DD
                picker_utc: false
                required: false
                hint: Déjala vacía si todavía no hay día.
              - label: Fecha por confirmar
                name: por_confirmar
                widget: boolean
                default: false
                hint: Muestra "??.?? POR ANUNCIAR" en lugar del día.
              - label: Lugar
                name: lugar
                widget: string
              - label: Ciudad
                name: ciudad
                widget: string
              - label: Invitados
                name: invitados
                widget: string
                required: false
                hint: Se muestra como "w/ …". Ejemplo — WarakaPunk + grupos locales
              - label: Nota
                name: nota
                widget: string
                required: false
                hint: Texto libre que se muestra si no hay invitados. Ejemplo — Fechas cada mes
              - label: Botón
                name: boton
                widget: select
                default: entradas
                options:
                  - { label: "ENTRADAS (rojo)", value: entradas }
                  - { label: "CONSULTAR", value: consultar }
              - label: Mensaje de WhatsApp
                name: mensaje
                widget: string
                hint: Texto que llega a su WhatsApp cuando alguien toca el botón.
              - label: Enlace de venta (opcional)
                name: enlace
                widget: string
                required: false
                hint: Si pones un enlace (Joinnus, Teleticket…), el botón lleva ahí en lugar de WhatsApp.

  # ─────────────────────── TELETIENDA ───────────────────────
  - name: teletienda
    label: Teletienda
    description: Productos del Merch. Los marcados como destacados rotan en la Teletienda de la portada.
    editor:
      preview: false
    files:
      - name: productos
        label: Productos
        file: data/merch.json
        format: json
        fields:
          - label: Productos
            name: productos
            label_singular: producto
            widget: list
            summary: "{{fields.nombre}} — S/ {{fields.precio}}"
            fields:
              - label: Nombre
                name: nombre
                widget: string
              - label: Nombre corto (opcional)
                name: nombre_corto
                widget: string
                required: false
                hint: Se usa en la lista del catálogo si el nombre es muy largo.
              - label: Precio (S/)
                name: precio
                widget: number
                value_type: float
                min: 0
              - label: Descripción
                name: descripcion
                widget: text
              - label: Fotos
                name: imagenes
                widget: list
                label_singular: foto
                hint: La primera es la principal. Si el producto tiene diseños, pon una foto por diseño en el mismo orden.
                field:
                  label: Foto
                  name: imagen
                  widget: image
                  choose_url: false
              - label: Opción a elegir
                name: opcion
                widget: select
                default: ninguna
                options:
                  - { label: "Ninguna", value: ninguna }
                  - { label: "Talla", value: talla }
                  - { label: "Diseño", value: diseno }
              - label: Valores de la opción
                name: valores
                widget: string
                required: false
                hint: Separados por comas. Tallas — S, M, L, XL · Diseños — 1, 2
              - label: Mensaje de WhatsApp
                name: mensaje
                widget: string
                hint: Se agrega solo la talla o el diseño elegido. Ejemplo — Hola, quiero el Polo Negro PANAQA
              - label: Destacado en la portada
                name: destacado
                widget: boolean
                default: false
              - label: Agotado
                name: agotado
                widget: boolean
                default: false
                hint: Se muestra tachado, con sello AGOTADO y sin botón de pedido.
              - label: Traducciones (opcional)
                name: traducciones
                widget: object
                collapsed: true
                required: false
                summary: "EN / 中文"
                fields:
                  - { label: "Nombre en inglés", name: nombre_en, widget: string, required: false }
                  - { label: "Nombre en chino", name: nombre_zh, widget: string, required: false }
                  - { label: "Descripción en inglés", name: descripcion_en, widget: text, required: false }
                  - { label: "Descripción en chino", name: descripcion_zh, widget: text, required: false }

  # ──────────────────────── ARCHIVO ────────────────────────
  - name: archivo
    label: Archivo de cintas
    description: Cintas VHS del estante del Videoclub (CH 07, videoclub.html). Cada cinta reproduce un video de YouTube en el televisor. El orden de la lista es el orden en el estante.
    editor:
      preview: false
    files:
      - name: cintas
        label: Cintas del estante
        file: data/archivo.json
        format: json
        fields:
          - label: Cintas
            name: cintas
            label_singular: cinta
            widget: list
            summary: "{{fields.etiqueta}} — {{fields.detalle}}"
            fields:
              - label: Texto de la etiqueta
                name: etiqueta
                widget: string
                hint: Lo que va escrito a mano en el lomo. Corto, idealmente menos de 14 letras.
              - label: Video de YouTube
                name: youtube
                widget: string
                hint: Pega el enlace del video o Short (youtube.com/watch?v=…, youtu.be/…, youtube.com/shorts/…). Debe ser público o no listado y permitir inserción.
              - label: Fecha (opcional)
                name: fecha
                widget: datetime
                date_format: DD/MM/YYYY
                time_format: false
                format: YYYY-MM-DD
                picker_utc: false
                required: false
                hint: Aparece en naranja en la esquina del televisor, como fecha de cámara casera.
              - label: Detalle en pantalla
                name: detalle
                widget: string
                required: false
                hint: Segunda línea bajo la fecha. Ejemplo — CC. Festiva, Ensayo, Backstage Cusco.
              - label: Franja de color del lomo
                name: franja
                widget: select
                default: ninguna
                options:
                  - { label: "Sin franja", value: ninguna }
                  - { label: "Rojo y amarillo", value: rojo-amarillo }
                  - { label: "Azul y gris", value: azul-gris }
                  - { label: "Verde y amarillo", value: verde-amarillo }
              - label: Tipo de etiqueta
                name: papel
                widget: select
                default: papel
                options:
                  - { label: "Papel blanco", value: papel }
                  - { label: "Papel viejo (amarillento)", value: viejo }
                  - { label: "Cinta de embalaje", value: embalaje }
              - label: Letra
                name: letra
                widget: select
                default: plumon
                options:
                  - { label: "Plumón", value: plumon }
                  - { label: "Manuscrita", value: manuscrita }
              - label: Cinta inclinada
                name: inclinada
                widget: boolean
                default: false
                hint: Para que el estante se vea más natural, inclina una que otra.

  # ──────────────────────── AJUSTES ────────────────────────
  - name: ajustes
    label: Ajustes
    editor:
      preview: false
    files:
      - name: ajustes
        label: Ajustes generales
        file: data/ajustes.json
        format: json
        fields:
          - label: Número de WhatsApp
            name: whatsapp
            widget: string
            pattern: ['^[0-9]{8,15}$', 'Solo números, con código de país. Ejemplo — 51907918581']
            hint: Recibe los pedidos y consultas de entradas.
          - label: Ocultar fechas pasadas
            name: ocultar_fechas_pasadas
            widget: boolean
            default: true
