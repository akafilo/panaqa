# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build settings (not needed for static site, but good to have)
  publish = "."
  
[build.environment]
  # Environment for build process
  NODE_VERSION = "18"

# Headers for optimal caching and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Bloquear Media Session API en iframes (evita controles de YouTube en la barra del navegador)
    Permissions-Policy = "mediasession=()"
    
    # Sin caché para HTML — siempre se sirve la versión más reciente
    Cache-Control = "no-cache, no-store, must-revalidate"

# CSS and JS files - no cache to ensure immediate updates
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "*.js"  
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service worker must never be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Imágenes: el navegador las guarda pero confirma con Netlify si cambiaron.
# No usar caché larga: las fotos que se suben desde /admin deben verse apenas
# termina la publicación, y un nombre de archivo puede cambiar de contenido.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects (if needed in the future)
# [[redirects]]
#   from = "/old-page"
#   to = "/new-page"
#   status = 301
